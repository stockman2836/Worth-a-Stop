<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worth a Stop</title>
  <script src="/appearance.js"></script>
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/leaflet.css">
  <script type="importmap">{"imports":{"opening_hours":"/opening-hours-lib.mjs","suncalc":"/suncalc.mjs","supercluster":"/supercluster.mjs","kdbush":"/kdbush.mjs"}}</script>
  <script type="module" src="/site.mjs"></script>
</head>
<body>
  <header>
    <span class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="10" fill="currentColor"/><path d="m22 9-4 12-8 2 4-12z" fill="none" stroke="var(--accent-ink)" stroke-width="1.8"/><circle cx="16" cy="16" r="2" fill="var(--accent-ink)"/></svg><span>Worth a Stop<span class="period" aria-hidden="true">.</span></span></span>
    <span id="tagline">Make every stop count.</span>
    <div class="header-actions"><div id="languages" role="group" aria-label="Language">
      <button type="button" lang="ru" aria-label="Русский" data-language="ru">RU</button>
      <button type="button" lang="en" aria-label="English" data-language="en">EN</button>
    </div>
    <button id="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false"><svg class="icon theme-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#moon"/></svg><svg class="icon theme-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#sun"/></svg><span>Dark</span></button></div>
  </header>
  <main>
    <section id="search-area">
    <div class="search-intro">
      <p id="intro-eyebrow" class="eyebrow">MAKE A DAY OF IT</p>
      <h1 id="heading">A new city. A day of your own.</h1>
      <p id="intro-lead">Discover interesting places, find local events and build a day worth remembering.</p>
    </div>
    <form id="search-form" role="search">
      <label for="query" id="query-label">City name</label>
      <div class="search-field">
        <input id="query" name="city" type="search" autocomplete="off" dir="auto">
        <button type="submit" id="submit">Search</button>
      </div>
    </form>
    <div class="journey-art" aria-hidden="true">
      <div class="journey-orbit orbit-one"></div><div class="journey-orbit orbit-two"></div>
      <svg viewBox="0 0 400 400" class="journey-map">
        <defs><pattern id="map-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="currentColor" stroke-width=".6"/></pattern></defs>
        <rect x="40" y="40" width="320" height="320" rx="42" fill="url(#map-grid)"/>
        <path class="art-river" d="M280 30c-80 80 40 120-20 200s-60 90-20 150"/>
        <path class="art-street" d="m30 180 340-70M90 30l80 340M30 300l330-60M330 40 70 350"/>
        <path class="art-route" d="M105 285C45 235 130 165 185 200S320 160 280 100"/>
        <circle class="art-node" cx="105" cy="285" r="12"/><circle class="art-node" cx="185" cy="200" r="9"/>
        <circle class="art-destination-ring" cx="280" cy="100" r="24"/><circle class="art-destination" cx="280" cy="100" r="10"/>
        <circle class="art-traveller" r="5"/>
        <path class="art-spark" d="m330 280 5 14 14 5-14 5-5 14-5-14-14-5 14-5z"/>
      </svg>
      <span id="journey-caption" class="journey-caption">One city. Your way.</span>
      <span class="art-compass">N · E · S · W</span>
    </div>
    </section>
    <section id="featured" hidden aria-labelledby="featured-label">
      <h2 id="featured-label">Cities with event listings</h2>
      <div id="featured-cities"></div>
    </section>
    <p id="status" role="status"></p>
    <ul id="results" aria-labelledby="status"></ul>
  </main>
  <footer><span id="attribution">Location data</span> · <a href="https://www.geonames.org/">GeoNames</a> / <a href="https://open-meteo.com/">Open-Meteo</a></footer>
  <template id="day-agenda">
    <section class="day-agenda">
      <div class="day-controls">
        <div class="day-shortcuts">
          <button type="button" data-day="today"></button>
          <button type="button" data-day="tomorrow"></button>
        </div>
        <label class="day-picker agenda-date"><span></span><input type="date" required></label>
      </div>
      <p class="day-status" role="status"></p>
      <ul class="day-events"></ul>
      <button type="button" class="more-events" hidden></button>
      <button type="button" class="retry-events" hidden></button>
    </section>
  </template>
</body>
</html>
